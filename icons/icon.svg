  <!-- timer button -->
  <rect x="226" y="62" width="60" height="34" rx="12" fill="#3b82f6"/>
  <!-- flame -->
  <path fill="url(#flame)" d="M256 146c10 44 76 78 76 150a76 76 0 0 1-152 0c0-36 18-60 36-78 2 26 14 42 30 48-8-44 0-86 10-120z"/>
  <path fill="#fde68a" d="M256 262c6 22 34 36 34 66a34 34 0 0 1-68 0c0-20 10-32 20-40 2 12 8 18 14 20-4-18-2-32 0-46z"/>
</svg>
